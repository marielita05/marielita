<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Rincón Coquette 🎀</title>
    <!-- Importamos fuentes elegantes desde Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        /* Paleta de colores y estilos globales */
        body {
            background-color: #FFF3FA; /* Rosa pastel muy suave */
            color: #4A3E3D; /* Café suave en lugar de negro para suavizar la vista */
            font-family: 'Playfair+Display', serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal estilo tarjetita vintage */
        .card-coquette {
            background-color: #FFFFFF;
            border: 2px dashed #ECBAD0; /* Borde punteado de encaje */
            border-radius: 20px; /* Bordes redondeados y suaves */
            padding: 40px;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(236, 186, 208, 0.4);
        }

        /* Icono o elemento de moño */
        .bow {
            font-family: 'Sacramento', cursive;
            font-size: 5rem;
            color: #C78CA0; /* Rosa viejo/rosado oscuro */
            margin: 0;
            line-height: 1;
        }

        /* Títulos */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-style: italic;
            color: #C78CA0;
            margin-top: 10px;
        }

        /* Texto de párrafo */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #7D6B69;
        }

        /* Botón decorativo */
        .btn-coquette {
            display: inline-block;
            background-color: #FFE1ED; /* Rosa pálido */
            color: #C78CA0;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 50px; /* Botón super redondo */
            font-weight: bold;
            border: 1px solid #ECBAD0;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-coquette:hover {
            background-color: #C78CA0;
            color: #FFFFFF;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- Estructura visible de la página -->
    <div class="card-coquette">
        <div class="bow">🎀</div>
        <h1>Es estilo coquette...</h1>
        <p>Bienvenida a un espacio lleno de encajes, tonos pasteles, flores y mucha delicadeza. Una estética vintage e hiperfemenina para inspirar tus días.</p>
        <a href="#" class="btn-coquette">Entrar con amor ♡</a>
    </div>

</body>
</html>
